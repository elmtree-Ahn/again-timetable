<style>
:root{
  --paper:#EDF0F3; --card:#FFF; --ink:#111A23; --muted:#5B6B7A; --line:#D7DEE5;
  --up:#0B6E75; --up-bg:#D9EDEE; --down:#A8501A; --down-bg:#F6E4D6;
  --amber:#C97A16; --naver:#04B14F; --tmap:#1A56C4;
  --shadow:0 1px 2px rgba(17,26,35,.10),0 3px 12px rgba(17,26,35,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1319; --card:#182028; --ink:#E8EEF4; --muted:#93A3B1; --line:#26313B;
  --up:#5FD3D9; --up-bg:#123239; --down:#F0A268; --down-bg:#3A2417;
  --amber:#E5A93F; --naver:#06C25B; --tmap:#5B8CF0; --shadow:0 1px 2px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#0D1319; --card:#182028; --ink:#E8EEF4; --muted:#93A3B1; --line:#26313B;
  --up:#5FD3D9; --up-bg:#123239; --down:#F0A268; --down-bg:#3A2417;
  --amber:#E5A93F; --naver:#06C25B; --tmap:#5B8CF0; --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}

/* 상단 고정: 제목 + 요일 */
.bar{position:sticky;top:0;z-index:9;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:18px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:50px;height:44px;padding:0 15px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);border-radius:22px;font-family:'Gothic A1',sans-serif;
  font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:10px;padding:12px 12px calc(env(safe-area-inset-bottom) + 40px)}

/* 정류장 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px 13px;box-shadow:var(--shadow)}
.card.past{opacity:.4}
.card.next{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset,var(--shadow)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.t{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:27px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.tag{border-radius:8px;padding:3px 8px;font-family:'Gothic A1',sans-serif;font-weight:700;font-size:13px}
.tag.up{background:var(--up-bg);color:var(--up)}
.tag.down{background:var(--down-bg);color:var(--down)}
.w{font-family:'Gothic A1',sans-serif;font-weight:700;font-size:17px;margin-left:auto;
  text-align:right;word-break:keep-all}
.p{font-size:16px;font-weight:600;line-height:1.3;word-break:keep-all}
.n{color:var(--muted);font-size:12.5px;margin-top:3px;word-break:keep-all}
.go{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:11px}
.btn{height:48px;border-radius:12px;color:#fff;text-decoration:none;display:flex;
  align-items:center;justify-content:center;font-family:'Gothic A1',sans-serif;
  font-weight:700;font-size:16px;letter-spacing:-.01em}
.btn.n1{background:var(--naver)} .btn.t1{background:var(--tmap)}
.btn:active{filter:brightness(.88)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* 학원 출발/도착 구분줄 */
.base{display:flex;align-items:center;gap:9px;padding:2px 4px;color:var(--muted)}
.base.past{opacity:.4}
.base .t{font-size:17px;font-weight:700;color:var(--muted)}
.base .lbl{font-size:13.5px;font-weight:500}
.base .rule{flex:1;height:1px;background:var(--line)}
.base .mini{height:34px;padding:0 12px;border-radius:10px;background:var(--naver);color:#fff;
  display:flex;align-items:center;font-family:'Gothic A1',sans-serif;font-weight:700;
  font-size:13px;text-decoration:none}
.foot{color:var(--muted);font-size:12px;line-height:1.6;padding:4px 4px 0}
</style>
</head>

const order = ['월','화','수','목','금','토'].filter(d => DATA[d]).concat(Object.keys(DATA).filter(d => d.includes('(')));
const enc = encodeURIComponent;
const naverURL = r => `nmap://route/car?dlat=${r.lat}&dlng=${r.lng}&dname=${enc(r.nav)}&appname=again.shuttle`;
// 티맵: goalx/goaly가 WGS84 경위도를 받는 계열. rGoX/rGoY는 카텍 좌표를 기대해 경위도를 주면 목적지가 안 잡힌다 (8/24 실기 확인)
const tmapURL = r => `tmap://route?goalname=${enc(r.nav)}&goalx=${r.lng}&goaly=${r.lat}`;
const mins = t => { const [h, m] = t.split(':').map(Number); return (h < 9 ? h + 12 : h) * 60 + m };
const trim = (n, w) => [...new Set((w ? w.split('·').reduce((a, x) => a.split(x + ' ').join(''), n) : n).split(' · '))].join(' · ');

function render(day){
  list.innerHTML = '';
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  const isToday = day === ['일','월','화','수','목','금','토'][now.getDay()];
  const nextIdx = isToday ? DATA[day].findIndex(r => mins(r.t) >= nowM) : -1;

  DATA[day].forEach((r, i) => {
    const state = (nextIdx >= 0 && i < nextIdx ? ' past' : '') + (i === nextIdx ? ' next' : '');
    const el = document.createElement('div');
    if (r.k === 'base') {
      el.className = 'base' + state;
      el.innerHTML = `<span class="t">${r.t}</span><span class="lbl">${r.p} · ${r.n}</span>
        <span class="rule"></span>
        ${r.p.includes('도착') ? `<a class="mini" href="${naverURL(r)}">학원</a>` : ''}`;
    } else {
      el.className = 'card' + state;
      el.innerHTML = `<div class="head">
          <span class="t">${r.t}</span>
          <span class="tag ${r.k === '승' ? 'up' : 'down'}">${r.k === '승' ? '승차' : '하차'}</span>
          <span class="w">${r.w}</span>
        </div>
        <div class="p">${r.p}</div>
        ${r.n ? `<div class="n">${trim(r.n, r.w)}</div>` : ''}
        <div class="go">
          <a class="btn n1" href="${naverURL(r)}">네이버 지도</a>
          <a class="btn t1" href="${tmapURL(r)}">티맵</a>
        </div>`;
    }
    list.appendChild(el);
  });

  const foot = document.createElement('p');
  foot.className = 'foot';
  foot.textContent = '시각은 운행 계획표 기준이며 실제 교통에 따라 달라집니다. 버튼이 앱을 못 열면 해당 앱 설치를 확인하세요.';
  list.appendChild(foot);

  if (nextIdx > 0) {
    const el = list.children[nextIdx], bar = document.querySelector('.bar');
    const top = el.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 8;
    window.scrollTo({top: Math.max(0, top)});
  } else {
    window.scrollTo({top: 0});
  }
  [...tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.textContent === day)));
}

order.forEach(d => {
  const b = document.createElement('button');
  b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = d;
  b.onclick = () => render(d);
  tabs.appendChild(b);
});
const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
render(order.includes(today) ? today : '월');   // 켜면 오늘 요일 · 현재 시각 다음 정류장이 맨 위
</script>
</body>
</html>
