<style>
:root{
  --paper:#EEF1F4; --card:#FFF; --ink:#111A23; --muted:#5B6B7A; --line:#D8DFE6;
  --up:#0B6E75; --up-bg:#DCEEEF; --down:#A8501A; --down-bg:#F6E5D7;
  --base:#6B7885; --base-bg:#E3E8ED; --amber:#C97A16;
  --naver:#04B14F; --tmap:#1A56C4; --shadow:0 1px 2px rgba(17,26,35,.10),0 4px 14px rgba(17,26,35,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E141A; --card:#182129; --ink:#E8EEF4; --muted:#93A3B1; --line:#27333E;
  --up:#5FD3D9; --up-bg:#12333A; --down:#F0A268; --down-bg:#3A2417;
  --base:#8A98A5; --base-bg:#212B34; --amber:#E5A93F;
  --naver:#06C25B; --tmap:#5B8CF0; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#0E141A; --card:#182129; --ink:#E8EEF4; --muted:#93A3B1; --line:#27333E;
  --up:#5FD3D9; --up-bg:#12333A; --down:#F0A268; --down-bg:#3A2417;
  --base:#8A98A5; --base-bg:#212B34; --amber:#E5A93F;
  --naver:#06C25B; --tmap:#5B8CF0; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 48px}
header{padding:18px 2px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:22px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.tabs{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;min-height:44px;padding:0 14px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);border-radius:12px;font-family:'Gothic A1',sans-serif;
  font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;
  display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;box-shadow:var(--shadow)}
.row.base{background:transparent;border-style:dashed;box-shadow:none;padding:7px 12px}
.t{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.row.base .t{font-size:16px;font-weight:700;color:var(--muted)}
.mid{min-width:0}
.p{font-weight:600;font-size:15.5px;line-height:1.3;word-break:keep-all}
.row.base .p{font-weight:500;font-size:14px;color:var(--muted)}
.w{font-family:'Gothic A1',sans-serif;font-weight:700;font-size:15px;margin-top:2px}
.n{color:var(--muted);font-size:12.5px;margin-top:2px;word-break:keep-all}
.tag{display:inline-block;min-width:24px;text-align:center;border-radius:7px;padding:1px 6px;
  font-family:'Gothic A1',sans-serif;font-weight:700;font-size:13px;margin-right:6px;vertical-align:1px}
.tag.up{background:var(--up-bg);color:var(--up)}
.tag.down{background:var(--down-bg);color:var(--down)}
.btns{display:flex;flex-direction:column;gap:5px}
.btn{min-height:38px;min-width:74px;border-radius:10px;color:#fff;text-decoration:none;
  display:flex;align-items:center;justify-content:center;font-family:'Gothic A1',sans-serif;
  font-weight:700;font-size:14px;letter-spacing:-.01em}
.btn.n1{background:var(--naver)} .btn.t1{background:var(--tmap)}
.btn:active{filter:brightness(.9)} .btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.note{margin:14px 2px 0;color:var(--muted);font-size:12.5px;line-height:1.6}
@media (max-width:400px){.row{grid-template-columns:56px 1fr auto;gap:8px}.btn{min-width:62px;font-size:13px}}
</style>

const tabs = document.getElementById('tabs'), list = document.getElementById('list');
const order = ['월','화','수','목','금','토'].filter(d=>DATA[d]).concat(Object.keys(DATA).filter(d=>d.includes('(')));
const enc = encodeURIComponent;
function naverURL(r){return `nmap://route/car?dlat=${r.lat}&dlng=${r.lng}&dname=${enc(r.nav)}&appname=again.shuttle`}
function tmapURL(r){return `tmap://route?goalname=${enc(r.nav)}&goaly=${r.lat}&goalx=${r.lng}`}
function render(day){
  list.innerHTML = '';
  for (const r of DATA[day]) {
    const el = document.createElement('div');
    el.className = 'row' + (r.k === 'base' ? ' base' : '');
    const tag = r.k === '승' ? '<span class="tag up">승차</span>' : r.k === '하' ? '<span class="tag down">하차</span>' : '';
    el.innerHTML = `<div class="t">${r.t}</div><div class="mid">
      <div class="p">${tag}${r.p}</div>
      ${r.w ? `<div class="w">${r.w}</div>` : ''}
      ${r.n ? `<div class="n">${r.n}</div>` : ''}</div>
      ${r.k === 'base' && !r.p.includes('도착') ? '<div></div>' : `<div class="btns">
        <a class="btn n1" href="${naverURL(r)}">네이버</a>
        <a class="btn t1" href="${tmapURL(r)}">티맵</a>
      </div>`}`;
    list.appendChild(el);
  }
  [...tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.textContent === day)));
}
order.forEach(d => {
  const b = document.createElement('button');
  b.className = 'tab'; b.role = 'tab'; b.textContent = d;
  b.onclick = () => render(d);
  tabs.appendChild(b);
});
const today = ['일','월','화','수','목','금','토'][new Date().getDay()];
render(order.includes(today) ? today : order[0]);
</script>
